
name: dbt CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # Credential-free validation for pushes and pull requests
  dbt-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.13.0b1 dbt-snowflake==1.12.4

      - name: Configure temporary profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          Practice:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ci-placeholder
                user: ci-placeholder
                password: ci-placeholder
                role: ci-placeholder
                warehouse: ci-placeholder
                database: DBTPRACTICE
                schema: LEARNING
                threads: 1
          EOF

      - name: Validate dbt project
        run: dbt parse --no-partial-parse

  # Snowflake credentials are used only on trusted pushes to main
  snowflake-connection:
    needs: dbt-parse
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      DBT_PRIVATE_KEY_PATH: /home/runner/.dbt/rsa_key.p8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.13.0b1 dbt-snowflake==1.12.4

      - name: Create private key file
        shell: bash
        run: |
          mkdir -p ~/.dbt
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$DBT_PRIVATE_KEY_PATH"
          chmod 600 "$DBT_PRIVATE_KEY_PATH"

      - name: Configure Snowflake profile
        shell: bash
        run: |
          cat > ~/.dbt/profiles.yml <<'EOF'
          Practice:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                database: DBTPRACTICE
                schema: DBT_CI
                private_key_path: "{{ env_var('DBT_PRIVATE_KEY_PATH') }}"
                threads: 1
          EOF

      - name: Test Snowflake connection
        run: dbt debug --target ci
